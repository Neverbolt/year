<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year · Design review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080d1b;color:#e2e8f0}*{box-sizing:border-box}body{margin:0}header{padding:24px 28px;border-bottom:1px solid #334155}small{color:#7dd3fc;letter-spacing:.12em;text-transform:uppercase}h1{font-size:28px;margin:8px 0}p{color:#94a3b8;max-width:850px;line-height:1.5}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button,a{font:inherit;color:#e2e8f0;background:#1e293b;border:1px solid #475569;border-radius:8px;padding:9px 14px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#0c4a6e;border-color:#38bdf8}main{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}article{min-width:0}h2{font-size:15px;margin:0 0 10px}h2 span{font-weight:400;color:#94a3b8}iframe{width:100%;height:850px;border:1px solid #334155;border-radius:12px;background:#020617}.single{grid-template-columns:1fr}.single iframe{height:900px}.mobile iframe{max-width:390px;height:844px}.mobile article{text-align:center}.notes{padding:0 28px 20px;color:#94a3b8}a:focus-visible,button:focus-visible{outline:2px solid #38bdf8;outline-offset:3px}@media(max-width:900px){main{grid-template-columns:1fr}header{padding:20px}}
</style>
<header><h1>Design review</h1><p>Original and proposed versions use the same sample data. Changes reset on reload.</p><nav aria-label="Review scenarios"><button data-scene="year" aria-pressed="true">Year calendar</button><button data-scene="month" aria-pressed="false">Note contrast · visual aid</button><button data-scene="overview" aria-pressed="false">Year overview</button><button id="width" aria-pressed="false">390px mobile</button><a href="/baseline" target="_blank">Open original ↗</a><a href="/candidate" target="_blank">Open proposal ↗</a></nav><p id="reviewNote" role="status">Year calendar: compare the overall layout. January 1–3 has an uncategorized note; it should be readable in the proposal.</p></header>
<main><article id="before"><h2>Before <span>· bbade93</span></h2><iframe title="Original year calendar" src="/baseline"></iframe></article><article><h2>Proposed <span>· working tree</span></h2><iframe title="Proposed year calendar" src="/candidate"></iframe></article></main>
<script>
const frames=[...document.querySelectorAll('iframe')];
let currentScene='year';
function scene(name){currentScene=name;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===name));document.getElementById('before').hidden=name==='overview';document.querySelector('main').classList.toggle('single',name==='overview');frames.forEach((frame,index)=>{const win=frame.contentWindow;win.eval(`closeAllModals(); state.view=${JSON.stringify(name==='month'?'month':'year')};state.currentDate=new Date(2026,0,1);renderCalendar();`);if(name==='overview'&&index===1)win.document.getElementById('toggleYearOverview').click();});document.getElementById('reviewNote').textContent=name==='overview'?'Year overview: this is a new popup, so there is no original to compare. Use the arrows beside 2026 to change years and check the counts. Return to 2026, click Populate weekends, then close the popup to see the added corner markers. Categories, notes, and the January 10 holiday circle should remain.':name==='month'?'Visual aid using the existing Month view, enlarged to inspect text; no new calendar layout is being introduced. Compare note readability on January 1–3 (no category), January 5 (bright fill), and January 6 (dark fill). Only the text colors change.':'Year calendar: compare the overall layout. January 1–3 has an uncategorized note; it should be readable in the proposal.';}
document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>scene(button.dataset.scene));
document.getElementById('width').onclick=event=>{const mobile=document.querySelector('main').classList.toggle('mobile');event.currentTarget.setAttribute('aria-pressed',mobile);if(mobile)document.getElementById('reviewNote').textContent+=' Mobile check: controls should fit without horizontal scrolling; the summary should use two columns.';else scene(currentScene);};
</script></html>
